name: Build Android APK (UnLim Cloud)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Android Platform
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.kratosle --project-name=unlim_cloud
          
          # Inject Android Permissions
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>' android/app/src/main/AndroidManifest.xml
          
          # Set local.properties with SDK 36 and minSdk 21
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
          echo "flutter.compileSdkVersion=36" >> android/local.properties

          # Force subprojects compileSdk 36 and disable CheckAarMetadata
          if [ -f "android/build.gradle" ]; then
            echo "" >> android/build.gradle
            echo "subprojects {" >> android/build.gradle
            echo "    afterEvaluate { project ->" >> android/build.gradle
            echo "        if (project.hasProperty('android')) {" >> android/build.gradle
            echo "            project.android {" >> android/build.gradle
            echo "                compileSdkVersion 36" >> android/build.gradle
            echo "            }" >> android/build.gradle
            echo "        }" >> android/build.gradle
            echo "    }" >> android/build.gradle
            echo "    project.tasks.configureEach { task ->" >> android/build.gradle
            echo "        if (task.name.contains('CheckAarMetadata')) {" >> android/build.gradle
            echo "            task.enabled = false" >> android/build.gradle
            echo "        }" >> android/build.gradle
            echo "    }" >> android/build.gradle
            echo "}" >> android/build.gradle
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons > build.log 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ BUILD FAILED!"
            tail -n 150 build.log
            exit $EXIT_CODE
          fi
          
          # Copy to a clean branded name
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/UnLim-Cloud-v1.0.0.apk

      - name: Upload Universal APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UnLim-Cloud-APK
          path: build/app/outputs/flutter-apk/UnLim-Cloud-v1.0.0.apk
          if-no-files-found: error

      - name: Publish Direct Release (Easy Download)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "UnLim Cloud v1.0.0 Release"
          body: |
            ## 🚀 UnLim Cloud Storage v1.0.0 APK
            - **Unlimited Cloud Storage** backed by Telegram Bot API & Private Channels
            - **Recursive Folder Upload**: Upload whole directories preserving folder hierarchy
            - **Instant Media Streaming**: Play cloud videos and view images directly without downloading
            - **Custom Local Bot API Support**: File limit up to 2GB
            
            ### 📥 Download APK
            Download **UnLim-Cloud-v1.0.0.apk** directly below and install on Android.
          files: |
            build/app/outputs/flutter-apk/UnLim-Cloud-v1.0.0.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Error Log to Git Branch on Failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B build-logs
          if [ -f build.log ]; then
            cp build.log error.txt
          else
            echo "Build failed before build.log was generated." > error.txt
          fi
          git add error.txt
          git commit -m "chore: save build failure log" || true
          git push -f origin build-logs || true
