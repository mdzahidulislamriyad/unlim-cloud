name: Build Android APK (UnLim Cloud)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Android APK
        run: |
          set +e
          exec > build.log 2>&1
          
          echo "=== 1. Configure Android Platform ==="
          rm -rf android
          flutter create . --platforms=android --org=com.kratosle --project-name=unlim_cloud
          
          # Inject Android Permissions & Cleartext Network Security Config
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>' android/app/src/main/AndroidManifest.xml
          
          mkdir -p android/app/src/main/res/xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<network-security-config>\n    <base-config cleartextTrafficPermitted="true">\n        <trust-anchors>\n            <certificates src="system" />\n        </trust-anchors>\n    </base-config>\n    <domain-config cleartextTrafficPermitted="true">\n        <domain includeSubdomains="true">127.0.0.1</domain>\n        <domain includeSubdomains="true">localhost</domain>\n    </domain-config>\n</network-security-config>\n' > android/app/src/main/res/xml/network_security_config.xml

          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml\/network_security_config"/g' android/app/src/main/AndroidManifest.xml
          
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.targetSdkVersion=35" >> android/local.properties
          echo "flutter.compileSdkVersion=37" >> android/local.properties
          echo "android.suppressUnsupportedCompileSdk=36,37" >> android/gradle.properties

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/g' android/app/build.gradle.kts
          fi

          echo "=== 2. Get Dependencies ==="
          flutter pub get
          PUB_STATUS=$?
          if [ $PUB_STATUS -ne 0 ]; then
            echo "❌ flutter pub get failed with code $PUB_STATUS"
            exit $PUB_STATUS
          fi

          echo "=== 3. Build APK ==="
          flutter build apk --release --no-tree-shake-icons
          BUILD_STATUS=$?
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "❌ flutter build apk failed with code $BUILD_STATUS"
            exit $BUILD_STATUS
          fi

          echo "=== 4. Prepare Branded Release ==="
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/UnLim-Cloud-v1.0.3.apk
          echo "✅ Build completed successfully!"

      - name: Upload Universal APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UnLim-Cloud-APK
          path: build/app/outputs/flutter-apk/UnLim-Cloud-v1.0.3.apk
          if-no-files-found: error

      - name: Publish Direct Release (Easy Download)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "UnLim Cloud v1.0.3 Release (Bulletproof Local Streaming & 404 Fix)"
          body: |
            ## 🚀 UnLim Cloud Storage v1.0.3 APK
            - **100% Fixed HTTP 404 in Image & Video Playback**: Dynamic file_id resolution avoids temporary/deleted file paths.
            - **Automatic Fallback & URL Refresh**: If any cached URL fails, it automatically queries Telegram Bot API for the fresh persistent URL.
            - **Fixed Folder Files View**: Opening any folder now correctly shows the files inside that folder.
            - **Upload Files Directly to Folder**: Added "Upload Files Here" button inside folders.
            - **Seamless Local 2GB Streaming**: Streams local videos with zero buffering using the upgraded range server.
            
            ### 📥 Download APK
            Download **UnLim-Cloud-v1.0.3.apk** directly below.
          files: |
            build/app/outputs/flutter-apk/UnLim-Cloud-v1.0.3.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Error Log to Git Branch on Failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B build-logs
          if [ -f build.log ]; then
            cp build.log error.txt
          else
            echo "Build failed before build.log was generated." > error.txt
          fi
          git add error.txt
          git commit -m "chore: save build failure log" || true
          git push -f origin build-logs || true
