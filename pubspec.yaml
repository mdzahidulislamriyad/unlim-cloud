name: unlim_cloud
description: "UnLim Cloud - Unlimited Free Cloud Storage for Android using Telegram API"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # HTTP & Networking
  http: ^1.2.0
  http_parser: ^4.0.2
  path: ^1.9.0
  # State Management & DI
  provider: ^6.1.2
  # Local Storage & Preferences
  shared_preferences: ^2.2.3
  path_provider: ^2.1.2
  # UI & Media
  intl: ^0.19.0
  file_picker: ^8.0.0
  cached_network_image: ^3.3.1
  open_filex: ^4.5.0
  share_plus: ^9.0.0
  permission_handler: ^11.3.1
  flutter_spinkit: ^5.2.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
